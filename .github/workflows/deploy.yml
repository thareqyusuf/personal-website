name: deploy

on:
  push:
    branches: [main]
  pull_request:            # build + checks only, no deploy
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false   # never interrupt a half-finished upload

env:
  HUGO_VERSION: 0.140.2

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history so lastmod can come from git

      - name: Install Hugo ${{ env.HUGO_VERSION }}
        run: |
          curl -fsSL -o /tmp/hugo.tgz \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf /tmp/hugo.tgz -C /usr/local/bin hugo
          hugo version

      - name: Build
        run: HUGO_BUILD_SHA="${GITHUB_SHA::7}" hugo --gc --minify --environment production

      - name: Check (feeds, budgets, nginx rules)
        run: |
          sudo apt-get install -y -q nginx-light libxml2-utils >/dev/null
          ./scripts/check.sh public

      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: public
          path: public

      - name: SSH setup
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload release
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          SHA="${GITHUB_SHA::7}"
          # The deploy key is jailed to /srv/site/releases by rrsync, so the path is relative to it.
          rsync -az --checksum public/ "deploy@${HOST}:${SHA}/"

      - name: Activate
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh "deploy@${HOST}" "activate ${GITHUB_SHA::7}"

      - name: Purge edge cache
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" -H "Content-Type: application/json" \
            --data '{"purge_everything":true}' | grep -q '"success":true'

      - name: Smoke test through the edge
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          [ -n "$SITE_URL" ] || { echo "set repository variable SITE_URL to enable"; exit 0; }
          curl -fsS -o /dev/null -w "home %{http_code} in %{time_total}s\n" "$SITE_URL/"
          curl -fsS "$SITE_URL/__probe" | grep -q '"srtt_us"'
          curl -fsS -o /dev/null "$SITE_URL/index.xml"
