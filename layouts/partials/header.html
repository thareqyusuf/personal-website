<header class="masthead">
  <a class="wordmark" href="/">{{ site.Title }}</a>
  <nav aria-label="Main">
    <ul>
    {{- $cur := . }}
    {{- range site.Menus.main }}
      {{- $active := or ($cur.IsMenuCurrent "main" .) ($cur.HasMenuCurrent "main" .) (and $cur.Section (eq .URL (printf "/%s/" $cur.Section))) (eq .URL $cur.RelPermalink) }}
      <li><a href="{{ .URL }}"{{ if $active }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
    {{- end }}
    </ul>
  </nav>
</header>
