# Reference latencies used by the probe strip to put a measured RTT in context.
# Source: "Latency numbers 2026 edition" (napkin-math re-measure, Mar 2026; Jeff Dean 2012 rows).
# Typical / best case, not p99. Units: nanoseconds.
# The probe renders "your RTT ≈ N × <ref>" for each entry with show: true.
refs:
  - key: dram
    label: DRAM reads
    ns: 100
    show: true
  - key: nvme
    label: random NVMe reads
    ns: 50000          # ~20–100 µs; midpoint-ish
    show: true
  - key: zone_rtt
    label: same-zone datacenter RTTs
    ns: 150000         # ~100–250 µs
    show: false
  - key: hdd
    label: HDD seeks
    ns: 10000000       # ~10 ms
    show: true
# "Humanized" scale: 1 ns → 1 s, so multiply by 1e9.
humanize_factor: 1000000000
