"https://distill.pub/2019/safety-needs-social-scientists/":
  title: "AI Safety Needs Social Scientists"
  author: "Geoffrey Irving and Amanda Askell"
  venue: "Distill"
  date: "2019"
  note: |
    If you are not an ML person and wondered where you fit, this is the paper to read. Their proposal is a debate, two AIs argue, a human judges, and the whole scheme only works “above some threshold” of judge ability. So the open questions are about people, not models. They expand this by questioning how skilled are people as judges by default? can we distinguish good judges from bad? does judge ability generalise across domains? can we train people to be better judges? what questions are people better at answering? are there ways to restrict debate to make it easier to judge? how can people work together to improve quality? None of those is a machine learning question.

    The disciplines they name are “experimental psychology, cognitive science, economics, political science, and social psychology,” with neuroscience and law as adjacent. The core skill is “the careful design of rigorous experiments” on humans, which ML researchers are not trained in. Cognitive scientists, for the biases that make a judge fall for a confident wrong answer. Economists and political scientists, because debate is a game and someone has to design its incentives. An actual debaters as subjects, because they note that “lying effectively is required for a meaningful experiment”: you need people who can argue a false position well. I’d add anthropologists, since they admit the answers “may be different in other communities or cultures”  and i believe there certain kind of latent knowledge worth pursuing into.

"https://blog.redwoodresearch.org/p/capabilities-research-expands-the":
  title: "Capabilities research expands the safety-usefulness frontier"   # TODO: confirm title
  author: "Alex Mallen"
  venue: "Redwood Research blog"
  date: "2 Oct 2026"
  note: |
    This is one of the frameworks I use to keep capabilities and safety apart in my head, because the obvious definition fails. If safety research is “anything that lets you deploy more safely without losing usefulness”, then nearly all capabilities research qualifies, and as he puts it, “something has gone wrong with our definition of safety research if it includes seemingly all capabilities research.”

    A few things from the post that didn’t fit in the essay narrative. He defines safety bluntly as the probability the model doesn’t take over. For context, this is a very AI Control definition of AI Safety so we need to keep in my why he bring up these certain examples in the blog.

    Appendix B is the part I think should have been the main argument because safety is very hard to measure, usefulness is easy. This is important because it implies that labs or dev can actually reduce the safety axis without even noticing. That asymmetry is what I mean when I say safety has no trend line. He also thinks current frontier capabilities work is “probably bad.” So do I.

