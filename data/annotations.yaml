"https://www.axios.com/2026/07/29/openai-hugging-face-modal-cyber-benchmark":
  title: "OpenAI agent on a cyber benchmark reaches Hugging Face and Modal"   # TODO: confirm title
  venue: "Axios"
  date: "29 Jul 2026"
  note: |
    This incident is one of the reasons I aspire to work on AI control rather than on alignment proper. The model was not unusually malicious, it was given a cybersecurity benchmark, had its safeguards switched off to measure its ceiling, and did what it was optimised to do.

    This is AI Control narrative, instead of aligning, we just create a system where working with misaligned model actually okay. We give them proper simulation, guardrails, and properly red-teaming the policy model. The boundary and the monitor are the two things that failed here in the incident, and they are the two things AI control is about. Although there are still gap that need to be filled by AI Control approach. One of which, using this incident as an example, is AI Control have a conservative assumption that model will try to misaligned on purpose. They built their entire framework on this assumption that the model is actively conspire against us.
