# Everything that defines how the site is served. Included by every server block
# (production TLS in deploy/nginx/site.conf, plain HTTP in the local test config), so what
# you test locally is what runs in production.
#
# The including server block must set `root` and `$origin_name`.
#
# nginx gotcha: an `add_header` inside a location drops every add_header inherited
# from outer levels. That's why each location re-includes security-headers.conf.

index index.html;
charset utf-8;
etag on;
server_tokens off;

gzip on;
gzip_vary on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/css application/javascript application/json application/rss+xml application/xml image/svg+xml text/plain;

error_page 404 /404.html;

# --- Measurement endpoint for the footer probe. Never cached anywhere. ---------------
# $tcpinfo_rtt / $tcpinfo_rttvar are the kernel's smoothed RTT for *this socket*, in µs
# (getsockopt TCP_INFO). Behind Cloudflare the socket is edge→origin; direct, it's you→origin.
location = /__probe {
    default_type application/json;
    include      snippets/security-headers.conf;
    add_header   Cache-Control "no-store" always;
    add_header   X-Robots-Tag "noindex" always;
    access_log   off;
    return 200 '{"origin":"$origin_name","srtt_us":$tcpinfo_rtt,"rttvar_us":$tcpinfo_rttvar,"msec":$msec}\n';
}

# --- Fingerprinted CSS/JS: the name changes when the bytes do. -----------------------
location ~* "^/(css|js)/[^/]+\.[0-9a-f]{64}\.(css|js)$" {
    include    snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# --- Fonts are versioned by file name (-v1, -v2 …). ----------------------------------
location ^~ /fonts/ {
    include    snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    access_log off;
}

# --- RSS feeds: readers poll, so keep it cheap but not stale for long. ---------------
location ~ "(^|/)index\.xml$" {
    types { }
    default_type "application/rss+xml; charset=utf-8";
    include      snippets/security-headers.conf;
    add_header   Cache-Control "public, max-age=900, s-maxage=3600" always;
}

# --- Images. --------------------------------------------------------------------------
location ~* \.(png|jpe?g|gif|webp|avif|svg|ico)$ {
    include    snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=86400, s-maxage=2592000" always;
    access_log off;
}

# --- CV. Opens in the browser; short browser TTL so a new upload shows up within minutes. ------
location = /cv.pdf {
    types { }
    default_type application/pdf;
    include    snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=300, s-maxage=604800" always;
    add_header Content-Disposition 'inline; filename="thareq-yusuf-cv.pdf"' always;
}

# --- 404 page: short TTLs so a fixed broken link recovers quickly. -------------------
location = /404.html {
    internal;
    include    snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=60, s-maxage=600" always;
}

# --- HTML and everything else. --------------------------------------------------------
# Browser: 60 s. Edge: 7 days, because every deploy purges the edge.
location / {
    try_files $uri $uri/ =404;
    include    snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=60, s-maxage=604800, stale-while-revalidate=86400" always;
    add_header X-Origin $origin_name always;
}
