# Included inside every location (see the add_header note in site-locations.conf).
# giscus is the only third party: its script and its iframe.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://giscus.app; frame-src https://giscus.app; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
