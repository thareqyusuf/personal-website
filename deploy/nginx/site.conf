# /etc/nginx/conf.d/site.conf  (installed by deploy/bootstrap.sh; needs nginx >= 1.25.1 for `http2 on`)
#
# Origin for thareqyusuf.com. Only Cloudflare should ever talk to this box:
#   - ufw allows :443 from Cloudflare's IP ranges only (deploy/cf-ips.sh)
#   - TLS client cert from Cloudflare is required (Authenticated Origin Pulls)

# Anything on :80 is a scanner; Cloudflare talks to us on :443 only (SSL mode Full (strict)).
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

# Unknown SNI on :443: refuse the handshake instead of leaking the real cert.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name thareqyusuf.com www.thareqyusuf.com;

    # Cloudflare Origin CA certificate (15-year cert from the dashboard, trusted only by Cloudflare).
    ssl_certificate     /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Authenticated Origin Pulls: the handshake fails unless the client presents Cloudflare's cert.
    ssl_client_certificate /etc/ssl/cloudflare/authenticated_origin_pull_ca.pem;
    ssl_verify_client on;

    # Cloudflare keeps origin connections open for reuse; let it. Also keeps /__probe's srtt
    # a measurement of a warm connection rather than a fresh handshake.
    keepalive_timeout  300s;
    keepalive_requests 10000;

    # Restore the visitor IP for logs (generated by deploy/cf-ips.sh).
    include /etc/nginx/snippets/cloudflare-realip.conf;

    root /srv/site/current;        # symlink, swapped atomically by site-activate
    set  $origin_name "sgp1";      # matches params.originName in hugo.toml

    if ($host = www.thareqyusuf.com) { return 301 https://thareqyusuf.com$request_uri; }

    include /etc/nginx/snippets/site-locations.conf;
}
