# Loopback-only plain-HTTP listener for load tests (experiment E05) and local health checks.
# Same location rules as production, without TLS or the Cloudflare client cert, bound to 127.0.0.1 only:
# nothing outside the droplet can reach it, regardless of the firewall.
#
# Installed by experiments/e05-origin-capacity/setup.sh, removed by teardown.sh.
server {
    listen 127.0.0.1:8081;
    server_name thareqyusuf.com;
    root /srv/site/current;
    set $origin_name "loopback";
    access_log off;    # logging every request would measure the disk, not nginx
    include /etc/nginx/snippets/site-locations.conf;
}
